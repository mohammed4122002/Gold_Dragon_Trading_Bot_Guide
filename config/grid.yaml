# ═══════════════════════════════════════════════════════════════
#  شبكة التحوّط Buy Stop / Sell Stop — استراتيجية منفصلة عن Gold Dragon SMC
#
#  الفكرة: أمر Buy Stop فوق السعر وأمر Sell Stop تحته في آن واحد. كل ما
#  ينضرب أمر تُفتح صفقة وتُمدَّد الشبكة بأمر جديد بنفس الاتجاه، وتُغلق كل
#  صفقات السلة معاً عند بلوغ ربح عائم إجمالي (Basket TP). تربح من التذبذب
#  العرضي (Sideways) وتخسر في الاختراق الاتجاهي القوي بلا فلتر — لذلك كل
#  حدود الحماية أدناه إلزامية وليست اختيارية.
#
#  حد الخسارة اليومي *لا* يُعرَّف هنا: يُعاد استخدام risk.daily_loss_limit /
#  risk.weekly_loss_limit / risk.max_drawdown / risk.consecutive_losses_lock
#  من risk.yaml عبر RiskManager.daily_guard() — نفس المنطق المستخدم في بوت
#  Gold Dragon الأساسي بالضبط، بحالة منفصلة على القرص (risk_state_file أدناه)
#  حتى لا يتشارك البوتان نفس عداد الخسارة اليومي إن شُغّلا معاً.
#
#  ⚠️ القيم الافتراضية أدناه مضبوطة على "شبكة سريعة": خطوة أضيق وتردد أعلى.
#  اقرأ قسم التكاليف قبل تغيير أي رقم — تضييق الخطوة دون فهم التكاليف يجعل
#  الشبكة تعمل لصالح وسيطك لا لصالحك.
# ═══════════════════════════════════════════════════════════════

grid:
  enabled: false

  # ── مسافة الشبكة بين كل مستوى والذي يليه ──────────────────────
  step_mode: fixed          # fixed | atr
  # 1.5$ على الذهب = تردد أعلى بكثير من 3.0$ السابقة. لا تنزل تحت هذا الرقم
  # قبل التحقق من stops_level لدى وسيطك (راجع execution_guard أدناه).
  step_fixed: 1.5
  step_atr_period: 14
  step_atr_timeframe: "M5"  # إطار أقصر يناسب الشبكة السريعة
  step_atr_multiple: 0.35   # وضع atr: المسافة = ATR × هذا المضاعف

  # الحجم — ثابت لكل مستوى، بلا تدرّج/مضاعفة (مارتينغيل) عمداً
  lot_per_level: 0.01

  # الحد الأقصى الكلي لعدد المستويات (صفقات مفتوحة + أوامر معلّقة تابعة
  # للشبكة معاً). ما إن يُبلغ، تتوقف تمديد الشبكة بمستويات جديدة — الأوامر
  # القائمة تبقى قائمة حتى الانضراب أو إغلاق السلة.
  max_levels: 12

  # ── هدف السلة: الرقم الأهم في الملف كله ───────────────────────
  #
  # cost_plus (موصى به): الهدف = تكلفة السلة المفتوحة فعلاً + الصافي المطلوب.
  #   لماذا: على الذهب بلوت 0.01، حركة 1$ = ربح 1$. السبريد وحده ~0.20$ لكل
  #   صفقة + عمولة. سلة من 5 صفقات تكلّف ~1.25$ ذهاباً وإياباً — فهدف ثابت
  #   بقيمة 1.5$ يترك صافياً 0.25$ فقط. مع cost_plus يتمدد الهدف تلقائياً
  #   كلما كبرت السلة، فلا يوجد "ربح" يساوي عمولة الوسيط بالضبط.
  # fixed / per_lot: الوضعان القديمان — يتجاهلان التكلفة تماماً.
  basket_tp_mode: cost_plus
  basket_net_target_usd: 1.0    # الصافي المطلوب بعد كل التكاليف (وضع cost_plus)
  # عمولة الذهاب والإياب لكل 1.00 لوت بالدولار — **اقرأها من عقد وسيطك**.
  # حسابات ECN على الذهب عادة 5–8$ لكل لوت ذهاباً وإياباً؛ صفر يعني حساب
  # بلا عمولة (السبريد فقط). رقم خاطئ هنا = هدف خاطئ في كل صفقة.
  cost_commission_per_lot: 7.0
  basket_tp_usd: 5.0            # وضع fixed فقط
  basket_tp_per_lot_usd: 8.0    # وضع per_lot فقط

  # قطع مبكر مستقل عن حد الخسارة اليومي في risk.yaml — يغلق السلة فوراً
  # (لا يقفل التداول ليوم كامل، فقط يعيد ضبط هذه الشبكة) إن بلغت الخسارة
  # العائمة هذه النسبة من الرصيد. خط دفاع أول قبل أن تصل الخسارة اليومية
  # الإجمالية إلى حد risk.daily_loss_limit الذي يُوقف التداول ليوم كامل.
  max_basket_loss_pct: 0.03

  # ── بوابة التنفيذ — حرجة للشبكة السريعة ───────────────────────
  # تمنع **تسليح مستويات جديدة** فقط. الخروج (إغلاق السلة/الحصاد/Kill
  # Switch) لا يُمنع أبداً مهما اتسع السبريد.
  execution_guard:
    # فوق هذا السبريد لا تُسلَّح مستويات جديدة. عند الأخبار والتدوير اليومي
    # يتضاعف السبريد؛ خطوة 1.5$ مع سبريد 0.80$ تعني دخولاً خاسراً فوراً.
    # صفر = تعطيل البوابة (غير موصى به مع خطوة ضيقة).
    max_spread: 0.35
    # هامش أمان فوق stops_level المعلن من الوسيط (أدنى مسافة يقبلها لأمر
    # معلّق). أمر أقرب من ذلك يُرفض بـ retcode 10016 فتتوقف الشبكة بصمت.
    min_stop_distance_mult: 1.2
    # حد أدنى مطلق بالدولار — كثير من الوسطاء يعلنون stops_level=0 ثم
    # يرفضون ديناميكياً حسب السبريد اللحظي، فهذا الرقم شبكة أمان ثانية.
    min_stop_distance_usd: 0.20

  # ── حصاد الأزواج: إغلاق جزئي بدل كل-أو-لا-شيء ─────────────────
  # يغلق زوج شراء+بيع متقابل صافيه يغطي تكلفته ويزيد، فتتقلّص السلة تدريجياً
  # ويُبنَك التقدّم بدل انتظار السلة كاملة. هذا ما يمنع السلة من التضخم حتى
  # الانفجار في سوق متذبذب طويل.
  # ملاحظة: الحصاد يدخل حد الخسارة اليومي لكنه **لا** يمسّ عدّاد الخسارات
  # المتتالية — فهو إغلاق جزئي لا نتيجة صفقة مكتملة.
  pair_harvest:
    enabled: true
    min_net_usd: 0.30   # أقل صافي مطلوب **فوق تكلفة الزوج** لإغلاقه

  # ── حد عمر السلة ──────────────────────────────────────────────
  # سلة مفتوحة ساعات تعني أن السعر لم يعد يتذبذب حول الشبكة بل يتجه بعيداً
  # عنها — الخروج بالوضع الحالي أرخص من انتظار ارتداد قد لا يأتي.
  # صفر = تعطيل.
  max_basket_age_minutes: 240

  # ── تهدئة بعد إغلاق السلة ─────────────────────────────────────
  # الحركة التي أغلقت السلة بالقطع المبكر غالباً لم تنتهِ؛ إعادة بناء شبكة
  # فيها فوراً تعني تكرار نفس الخسارة مباشرة. صفر = تعطيل.
  # (حالة التهدئة في الذاكرة فقط — تُفقد بإعادة التشغيل عمداً، فهي ثوانٍ.)
  cooldown_seconds_after_close: 60

  # فلتر الاتجاه — الفرق الجوهري بين "احترقت" و"ربحت" في اللافتتين الصفراوين:
  # بلا هذا الفلتر تستمر الشبكة بالتمدد إلى ما لا نهاية باتجاه واحد أثناء
  # اختراق قوي، فتتضخم الخسارة العائمة أسرع من أي حد حماية آخر.
  trend_guard:
    enabled: true
    # أقصى عدد صفقات متتالية بنفس الاتجاه (بلا صفقة معاكسة بينها) قبل
    # إيقاف تمديد تلك الجهة تحديداً — الجهة المقابلة تبقى مسلّحة كما هي.
    max_directional_levels: 5

  # بعد إغلاق السلة عند Basket TP أو القطع المبكر: إعادة بناء شبكة جديدة
  # حول السعر الحالي تلقائياً بدل التوقف. يخضع لنفس بوابات الحماية (Kill
  # Switch وحد الخسارة اليومي والتهدئة) في الدورة التالية كأي تمديد آخر.
  reinitialize_after_close: true

  state_file: "state/grid_state.json"
  risk_state_file: "state/grid_risk_state.json"
  kill_switch_state_file: "state/grid_kill_switch.json"

  # فحص أسرع من بوت SMC: التفعيل قائم على ملامسة السعر لمستوى معلّق، لا
  # على إغلاق شمعة كاملة. الشبكة السريعة تحتاج دورة أقصر لتلتقط الحصاد
  # وحدود الخروج في وقتها.
  scan_interval_seconds: 5
